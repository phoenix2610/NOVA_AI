<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="NOVA AI — local voice assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ad7ff"/>
      <stop offset="1" stop-color="#c7b8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="220" cy="150" r="170" fill="url(#glow)"/>
  <g fill="#9ad7ff" opacity="0.9">
    <rect x="120" y="135" width="10" height="30" rx="5"/>
    <rect x="140" y="110" width="10" height="80" rx="5"/>
    <rect x="160" y="85" width="10" height="130" rx="5"/>
    <rect x="180" y="60" width="10" height="180" rx="5"/>
    <rect x="200" y="95" width="10" height="110" rx="5"/>
    <rect x="220" y="75" width="10" height="150" rx="5"/>
    <rect x="240" y="100" width="10" height="100" rx="5"/>
    <rect x="260" y="70" width="10" height="160" rx="5"/>
    <rect x="280" y="105" width="10" height="90" rx="5"/>
    <rect x="300" y="125" width="10" height="50" rx="5"/>
    <rect x="320" y="140" width="10" height="20" rx="5"/>
  </g>
  <text x="420" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="8" fill="url(#txt)">NOVA</text>
  <text x="424" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#b8c1e0">Local, privacy-first voice assistant for Linux</text>
  <text x="424" y="244" font-family="Consolas, Menlo, monospace" font-size="18" fill="#7f89ad">wake word · streaming STT · intent router · local LLMs · sandboxed exec · TTS</text>
</svg>
